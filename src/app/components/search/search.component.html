<search>
  <form (submit)="onSubmit($event, searchInput.value)">
    <label class="visually-hidden" for="artist-search">
      {{ 'search-artist' | transloco }}
    </label>
    <input
      #searchInput
      id="artist-search"
      type="search"
      name="term"
      enterkeyhint="search"
      [placeholder]="'search-artist' | transloco"
    />
    <button type="submit">{{ 'search' | transloco }}</button>
  </form>
</search>
