<ca-card>
  @if (artist()) {
    <div class="start-wrapper">
      <p>{{ number() }}.</p>
      @if (artistImageUrl(); as imageUrl) {
        <img
          [src]="imageUrl"
          [alt]="artistName()"
          width="174"
          height="174"
          loading="lazy"
        />
      } @else {
        <div class="no-image-placeholder">
          <span>{{ 'no-image' | transloco }}</span>
        </div>
      }
    </div>
    <div class="wrapper">
      <h1 class="truncated-name">{{ artist()!.name | truncate: 20 }}</h1>
      <h1 class="full-name">{{ artist()!.name }}</h1>

      <div class="inner-wrapper">
        <p>
          {{ artist()!.listeners | number: '' : 'en-US' }}
          {{ 'listeners' | transloco }}
        </p>
        <ng-container *transloco="let t">
          <a
            [href]="artist()!.url"
            rel="noopener noreferrer"
            target="_blank"
            [title]="t('link-to-artist', { artist: artistName() })"
            [attr.aria-label]="t('link-to-artist', { artist: artistName() })"
            >&#9432;</a
          >
        </ng-container>
      </div>
    </div>
  } @else {
    <p>{{ 'no-data' | transloco }}</p>
  }
</ca-card>
